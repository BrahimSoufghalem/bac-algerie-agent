# docker compose -f compose.yaml -f compose.production.yaml up --build -d
services:
  api:
    environment:
      SECURE_COOKIES: "true"
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN to your HTTPS hostname}
      TRUSTED_HOSTS: ${DOMAIN},127.0.0.1,localhost
  worker:
    environment:
      SECURE_COOKIES: "true"
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN to your HTTPS hostname}
      TRUSTED_HOSTS: ${DOMAIN},127.0.0.1,localhost
  proxy:
    image: caddy:2.10.2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1
volumes:
  caddy_data:
  caddy_config:
