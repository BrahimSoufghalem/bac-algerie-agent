name: Phase 1 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Backend dependencies and tests
        run: |
          python -m pip install -r requirements-dev.txt -c constraints.txt
          python -m pytest -q
      - name: Typecheck and build
        run: |
          npm ci
          npm run build
      - name: Local-only browser integration
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: browser-results/
