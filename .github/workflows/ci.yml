name: Platform verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Backend dependencies and tests
        run: |
          mkdir -p .ci-logs
          python -m pip install -r requirements-dev.txt -c constraints.txt 2>&1 | tee .ci-logs/dependencies.log
          python -m ruff check bac/core bac/agent bac/api bac/library bac/learning bac/science bac/ops bac/worker.py bac/cli.py examples tests --select F 2>&1 | tee .ci-logs/lint.log
          python -m pytest -q 2>&1 | tee .ci-logs/backend.log
      - name: Typecheck and build
        run: |
          npm ci
          npm run build 2>&1 | tee .ci-logs/build.log
      - name: Local-only browser integration
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          npx playwright install --with-deps chromium
          npm run test:browser 2>&1 | tee .ci-logs/browser.log
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: browser-results/

      - name: Report test failure to the internal pull request
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const names = ['dependencies', 'lint', 'backend', 'build', 'browser'];
            let reports = '';
            for (const name of names) {
              const path = `.ci-logs/${name}.log`;
              if (!fs.existsSync(path)) continue;
              const text = fs.readFileSync(path, 'utf8').split('\n').slice(-70).join('\n')
                .replace(/(?:sk-[a-zA-Z0-9-]{25,}|gh[pousr]_[a-zA-Z0-9]{25,})/g, '[REDACTED]')
                .replace(/```/g, '~~~');
              reports += `\n### ${name} (tail)\n\`\`\`text\n${text}\n\`\`\`\n`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `CI failure diagnostics for ${context.payload.pull_request.head.sha}\nRun: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nTest-only logs; no real model calls.\n` + reports.slice(-26000)
            });

  container:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: |
          mkdir -p .ci-logs
          docker build --progress=plain -t masar-bac:ci . 2>&1 | tee .ci-logs/container-build.log
      - name: Check compose, CLI, migration, non-root and persistent volume
        run: |
          exec > >(tee -a .ci-logs/container-runtime.log) 2>&1
          cp .env.example .env
          docker compose config --quiet
          DOMAIN=masar.example.invalid TLS_EMAIL=operator@example.invalid docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker run --rm masar-bac:ci sh -c 'test "$(id -u)" = 10001 && python -m bac.cli migrate'
          docker run --rm -e DOMAIN=masar.example.invalid -e TLS_EMAIL=operator@example.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker volume create masar-ci-data
          docker run -d --name masar-ci-api -p 127.0.0.1:8090:8090 -v masar-ci-data:/app/data --read-only --tmpfs /tmp:rw,size=256m --cap-drop ALL --security-opt no-new-privileges:true masar-bac:ci
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8090/health && break || sleep 2; done
          curl --fail --silent http://127.0.0.1:8090/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/agent/books)" = 401
          docker stop masar-ci-api
          docker run --rm -v masar-ci-data:/app/data masar-bac:ci python -m bac.cli migrate
          docker volume create masar-ci-backups
          docker volume create masar-ci-restore
          docker run --rm -v masar-ci-data:/app/data -v masar-ci-backups:/backup masar-bac:ci python -m bac.cli backup --output /backup/smoke.zip
          docker run --rm -v masar-ci-backups:/backup:ro -v masar-ci-restore:/restore masar-bac:ci python -m bac.cli restore --archive /backup/smoke.zip --destination /restore/new-data
          docker run --rm -e DATA_DIR=/restore/new-data -v masar-ci-restore:/restore masar-bac:ci python -m bac.cli migrate
      - name: Failure container logs
        if: failure()
        run: docker logs masar-ci-api 2>/dev/null || true

      - name: Report container failure diagnostics to internal PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = `Container failure for ${context.payload.pull_request.head.sha}\nRun: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;
            for (const name of ['container-build', 'container-runtime']) {
              const path = `.ci-logs/${name}.log`;
              if (!fs.existsSync(path)) continue;
              const text = fs.readFileSync(path, 'utf8').split('\n').slice(-90).join('\n').replace(/(?:sk-[a-zA-Z0-9-]{25,}|gh[pousr]_[a-zA-Z0-9]{25,})/g, '[REDACTED]').replace(/```/g, '~~~');
              body += `\n### ${name}\n\`\`\`text\n${text}\n\`\`\`\n`;
            }
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: body.slice(-26000)});
