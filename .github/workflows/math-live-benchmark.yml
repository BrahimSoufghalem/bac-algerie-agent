name: Gemini mathematics live benchmark
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight = Docker only; live = the original 24 real Gemini turns'
        type: choice
        options: [preflight, live]
        default: preflight
        required: true
      confirm_live:
        description: 'I approve real Gemini API usage (up to 128 requests; reported-input soft stop at 2.5M tokens)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: gemini-mathematics-live-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.event.repository.private == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      PYTHON_SANDBOX_URL: http://127.0.0.1:18871
      BENCH_BROKER: masar-math-broker-${{ github.run_id }}
      BENCH_AUTH_VOLUME: masar-math-auth-${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize private runtime paths
        run: |
          {
            printf 'MASAR_BENCHMARK_ROOT=%s/masar-math-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'GEMINI_API_KEY_FILE=%s/masar-gemini-key\n' "$RUNNER_TEMP"
            printf 'PYTHON_SANDBOX_TOKEN_FILE=%s/masar-python-token\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Validate explicit manual approval
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm_live }}
          KEY_PRESENT: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [[ "$MODE" == live && "$CONFIRM" != true ]]; then
            echo 'Live API usage requires the approval checkbox.'; exit 1
          fi
          if [[ "$MODE" == live && "$KEY_PRESENT" != true ]]; then
            echo 'Add the repository Actions secret GEMINI_API_KEY first.'; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies and validate the benchmark offline
        run: |
          python -m pip install -r requirements-dev.txt -c constraints.txt
          python -m pytest tests/test_math_live_benchmark.py -q
          python -m compileall -q benchmarks
      - name: Build the existing isolated Python images
        run: |
          docker build -f deploy/python-sandbox/runtime.Dockerfile -t masar-python-runtime:local .
          docker build -f deploy/python-sandbox/broker.Dockerfile -t masar-python-broker:local .
      - name: Existing Docker isolation and resource tests (no model calls)
        env:
          MASAR_PYTHON_DOCKER_TESTS: '1'
        run: python -m pytest tests/test_python_sandbox.py -q
      - name: Start the authenticated loopback-only broker
        run: |
          docker volume create "$BENCH_AUTH_VOLUME" >/dev/null
          docker run -d --name "$BENCH_BROKER" --network bridge \
            -p 127.0.0.1:18871:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$BENCH_AUTH_VOLUME:/run/masar-sandbox" \
            -e PYTHON_SANDBOX_IMAGE=masar-python-runtime:local \
            masar-python-broker:local >/dev/null
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18871/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18871/health >/dev/null
          umask 077
          docker exec "$BENCH_BROKER" cat /run/masar-sandbox/token > "$PYTHON_SANDBOX_TOKEN_FILE"
          python benchmarks/run_math_live.py preflight
      - name: Run the original 24 questions against real Gemini
        if: inputs.mode == 'live'
        timeout-minutes: 75
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          umask 077
          python - <<'PY'
          import os
          from pathlib import Path
          key = os.environ['GEMINI_API_KEY'].strip()
          if not 20 <= len(key) <= 256:
              raise SystemExit('Missing/invalid Gemini secret')
          path = Path(os.environ['GEMINI_API_KEY_FILE'])
          path.write_text(key)
          path.chmod(0o600)
          PY
          unset GEMINI_API_KEY
          python benchmarks/run_math_live.py init
          python benchmarks/run_math_live.py run 24
      - name: Export sanitized complete or partial evidence
        if: always()
        run: python benchmarks/report_math_live.py
      - name: Remove containers and private key/database files
        if: always()
        run: |
          docker rm --force "$BENCH_BROKER" >/dev/null 2>&1 || true
          docker ps -aq --filter name=masar-python- | xargs -r docker rm --force >/dev/null 2>&1 || true
          docker volume rm "$BENCH_AUTH_VOLUME" >/dev/null 2>&1 || true
          rm -f "$GEMINI_API_KEY_FILE" "$PYTHON_SANDBOX_TOKEN_FILE"
          rm -rf "$MASAR_BENCHMARK_ROOT/private"
      - name: Save redacted benchmark evidence (never the database or keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-math-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MASAR_BENCHMARK_ROOT }}/public/
          retention-days: 7
          if-no-files-found: warn
